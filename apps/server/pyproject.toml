[project]
name = "shifu"
version = "1.38.1"
description = "Add your description here"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.16",
    "aiosmtplib>=5.0",
    "argon2-cffi>=25.1",
    "cryptography>=50.0",
    "fastapi[standard]>=0.128.7",
    "PyJWT[crypto]>=2.10",
    "psycopg[binary]>=3.2",
    "resend==2.46.0",
    "sqlalchemy>=2.0",
    "inngest>=0.5",
    "pydantic-settings>=2.15.0",
    "redis>=8.1.0",
    "httpx>=0.28.1",
    "agno>=3.1.2",
    "openai>=3.26.1",
    "spacy>=3.8,<4",
    "sentence-transformers>=5,<6",
    "rank-bm25>=0.2.2,<0.3",
    "pgvector>=0.4,<0.5",
    "torch>=2.8",
    "pt-core-news-sm",
    "boto3==1.43.114",
    "Pillow==12.3.0",
    "pypdf==6.20.1",
    "pypdfium2==5.14.0",
    "opentelemetry-sdk>=1.45.1",
    "langfuse>=3,<4",
    "scikit-learn>=1.9.1",
    "huggingface-hub>=2.2.0,<3",
]

[dependency-groups]
dev = [
    "basedpyright>=1.38.2",
    "coverage>=7.16.2",
    "faker>=40.39.0",
    "httpx2>=2.13.1",
    "poethepoet>=0.41.0",
    "pyright>=1.1.408",
    "pytest>=9.0.2",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.0",
    "tach==0.35.0",
    "testcontainers>=4.15.0",
]

[project.scripts]
dev = "main:main"

[tool.poe.tasks."dev"]
cmd = "uv run --env-file .env.local python src/main.py"

[tool.poe.tasks."db:migrate"]
shell = "if [ -f .env.local ]; then uv run --env-file .env.local alembic revision --autogenerate -m \"${message}\"; else uv run alembic revision --autogenerate -m \"${message}\"; fi"
args = [{ name = "message", positional = true }]

[tool.poe.tasks."db:upgrade"]
shell = "if [ -f .env.local ]; then uv run --env-file .env.local alembic upgrade ${target}; else uv run alembic upgrade ${target}; fi"
args = [{ name = "target", positional = true, default = "head" }]

[tool.poe.tasks."db:downgrade"]
shell = "if [ -f .env.local ]; then uv run --env-file .env.local alembic downgrade ${target}; else uv run alembic downgrade ${target}; fi"
args = [{ name = "target", positional = true, default = "-1" }]

[tool.poe.tasks."db:sync"]
shell = "if [ -f .env.local ]; then uv run --env-file .env.local alembic stamp head; else uv run alembic stamp head; fi"

[tool.poe.tasks."db:current"]
shell = "if [ -f .env.local ]; then uv run --env-file .env.local alembic current; else uv run alembic current; fi"

[tool.poe.tasks."db:seed"]
cmd = "uv run --env-file .env.local python -m shifu.shared.database.seed"

[tool.poe.tasks."db:index:planning"]
cmd = "uv run --env-file .env.local python -m shifu.planning_indexes"

[tool.poe.tasks."db:index:mentor"]
cmd = "uv run --env-file .env.local python -m shifu.mentor_indexes"

[tool.poe.tasks."planner:word-vectors"]
cmd = "uv run python -m shifu.planning_word_vectors"

[tool.poe.tasks.test]
cmd = "pytest -s -x -vv"

[tool.poe.tasks."test:unit"]
shell = "if find tests -type f \\( -path 'tests/*/core/use_cases/test_*.py' -o -path 'tests/*/core/domain/test_*.py' -o -path 'tests/core/*/use_cases/test_*.py' \\) -print -quit | grep -q .; then find tests -type f \\( -path 'tests/*/core/use_cases/test_*.py' -o -path 'tests/*/core/domain/test_*.py' -o -path 'tests/core/*/use_cases/test_*.py' \\) -print0 | xargs -0 pytest; else echo 'No use-case unit tests found'; fi"

[tool.poe.tasks."test:integration"]
shell = "if find tests -type f \\( -path 'tests/*/server/test_*.py' -o -path 'tests/*/server/*/test_*.py' -o -path 'tests/rest/test_*.py' -o -path 'tests/rest/*/test_*.py' -o -path 'tests/*/rest/handlers/test_*.py' -o -path 'tests/intelligence/preparation/test_prepare_planning_indexes.py' -o -path 'tests/intelligence/capabilities/test_planning_capabilities.py' \\) -print -quit | grep -q .; then find tests -type f \\( -path 'tests/*/server/test_*.py' -o -path 'tests/*/server/*/test_*.py' -o -path 'tests/rest/test_*.py' -o -path 'tests/rest/*/test_*.py' -o -path 'tests/*/rest/handlers/test_*.py' -o -path 'tests/intelligence/preparation/test_prepare_planning_indexes.py' -o -path 'tests/intelligence/capabilities/test_planning_capabilities.py' \\) -print0 | xargs -0 pytest; else echo 'No server integration tests found'; fi"

[tool.poe.tasks."test:jobs"]
cmd = "pytest tests/messaging/inngest/jobs"
env = { SHIFU_RUN_REAL_INNGEST_TESTS = "1" }

[tool.poe.tasks."check:types"]
cmd = "basedpyright"

[tool.poe.tasks."check:lint"]
shell = "ruff check --no-fix src tests && ruff format --check src tests"

[tool.poe.tasks."check:architecture"]
cmd = "tach check --dependencies -e src/shifu/shared/database/seed.py,src/shifu/shared/database/seed_data.py"

[tool.poe.tasks.build]
cmd = "uv build"

[tool.poe.tasks.typecheck]
cmd = "basedpyright"

[tool.poe.tasks.codecheck]
shell = "ruff check --fix src tests && ruff format src tests && ruff format --check src tests"

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.13"
include = ["src", "tests"]
reportMissingTypeStubs = false
exclude = [
    "**/venv",
    "**/.venv",
    "**/env",
    "**/.env",
    "**/node_modules",
    "**/__pycache__",
]
venv = ".venv"
venvPath = "."
executionEnvironments = [{ root = "src" }]

[tool.pytest.ini_options]
addopts = "-s --color=yes --tb=short --import-mode=importlib"
pythonpath = [".", "src"]
testpaths = ["tests"]
filterwarnings = [
    "ignore::pydantic.warnings.PydanticDeprecatedSince20:inngest.*",
]

[tool.coverage.run]
patch = ["subprocess"]
sigterm = true

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.package-data]
"shifu.intelligence.ai.data" = ["*.json"]
"shifu.communication.providers.email.template.generated" = ["*.html", "*.json"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
pt-core-news-sm = { url = "https://github.com/explosion/spacy-models/releases/download/pt_core_news_sm-3.8.0/pt_core_news_sm-3.8.0-py3-none-any.whl" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
