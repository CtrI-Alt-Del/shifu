[project]
name = "shifu"
version = "1.38.1"
description = "Add your description here"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.16",
    "argon2-cffi>=25.1",
    "fastapi[standard]>=0.128.7",
    "PyJWT[crypto]>=2.10",
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0",
    "inngest>=0.5",
    "pydantic-settings>=2.15.0",
    "redis>=8.1.0",
]

[dependency-groups]
dev = [
    "basedpyright>=1.38.2",
    "faker>=40.39.0",
    "poethepoet>=0.41.0",
    "pyright>=1.1.408",
    "pytest>=9.0.2",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.0",
    "tach==0.35.0",
    "testcontainers>=4.15.0",
]

[project.scripts]
dev = "main:main"

[tool.poe.tasks."dev"]
cmd = "uv run --env-file .env.local python src/main.py"

[tool.poe.tasks."db:migrate"]
cmd = "alembic revision --autogenerate -m \"${message}\""
args = [{ name = "message", positional = true }]

[tool.poe.tasks."db:upgrade"]
cmd = "alembic upgrade ${target}"
args = [{ name = "target", positional = true, default = "head" }]

[tool.poe.tasks."db:downgrade"]
cmd = "alembic downgrade ${target}"
args = [{ name = "target", positional = true, default = "-1" }]

[tool.poe.tasks."db:sync"]
cmd = "alembic stamp head"

[tool.poe.tasks."db:current"]
cmd = "alembic current"

[tool.poe.tasks."db:seed"]
cmd = "uv run --env-file .env.local python -m shifu.shared.database.seed"

[tool.poe.tasks.test]
cmd = "pytest -s -x -vv"

[tool.poe.tasks."test:unit"]
shell = "if find tests -type f \\( -path 'tests/*/core/use_cases/test_*.py' -o -path 'tests/core/*/use_cases/test_*.py' \\) -print -quit | grep -q .; then find tests -type f \\( -path 'tests/*/core/use_cases/test_*.py' -o -path 'tests/core/*/use_cases/test_*.py' \\) -print0 | xargs -0 pytest; else echo 'No use-case unit tests found'; fi"

[tool.poe.tasks."test:integration"]
shell = "if find tests -type f \\( -path 'tests/*/server/test_*.py' -o -path 'tests/*/server/*/test_*.py' -o -path 'tests/rest/test_*.py' -o -path 'tests/rest/*/test_*.py' \\) -print -quit | grep -q .; then find tests -type f \\( -path 'tests/*/server/test_*.py' -o -path 'tests/*/server/*/test_*.py' -o -path 'tests/rest/test_*.py' -o -path 'tests/rest/*/test_*.py' \\) -print0 | xargs -0 pytest; else echo 'No server integration tests found'; fi"

[tool.poe.tasks."test:jobs"]
shell = "SHIFU_RUN_REAL_INNGEST_TESTS=1 pytest tests/messaging/inngest/jobs"

[tool.poe.tasks."check:types"]
cmd = "basedpyright"

[tool.poe.tasks."check:lint"]
shell = "ruff check --no-fix src tests && ruff format --check src tests"

[tool.poe.tasks."check:architecture"]
cmd = "tach check --dependencies -e src/shifu/shared/database/seed.py,src/shifu/shared/database/seed_data.py"

[tool.poe.tasks.build]
cmd = "uv build"

[tool.poe.tasks.typecheck]
cmd = "basedpyright"

[tool.poe.tasks.codecheck]
shell = "ruff check --fix src tests && ruff format src tests && ruff format --check src tests"

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.13"
include = ["src", "tests"]
reportMissingTypeStubs = false
exclude = [
    "**/venv",
    "**/.venv",
    "**/env",
    "**/.env",
    "**/node_modules",
    "**/__pycache__",
]
venv = ".venv"
venvPath = "."
executionEnvironments = [{ root = "src" }]

[tool.pytest.ini_options]
addopts = "-s --color=yes --tb=short"
pythonpath = [".", "src"]
testpaths = ["tests"]
filterwarnings = [
    "ignore::pydantic.warnings.PydanticDeprecatedSince20:inngest.*",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
package-dir = { "" = "src" }
