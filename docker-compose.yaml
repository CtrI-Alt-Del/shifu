name: shifu

services:
  postgres:
    image: postgres:17-alpine
    container_name: shifu-postgres
    pull_policy: missing
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shifu}
      POSTGRES_USER: ${POSTGRES_USER:-shifu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shifu-local}
    ports:
      - "${POSTGRES_PORT:-54344}:5432"
    volumes:
      - shifu-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  inngest:
    image: inngest/inngest:v1.41.1
    container_name: shifu-inngest
    pull_policy: missing
    restart: unless-stopped
    working_dir: /var/lib/inngest
    command:
      - inngest
      - dev
      - --host
      - 0.0.0.0
      - --port
      - "8288"
      - --connect-gateway-port
      - "8289"
      - --no-discovery
      - --persist
    ports:
      - "${INNGEST_PORT:-18288}:8288"
      - "${INNGEST_GATEWAY_PORT:-18289}:8289"
    volumes:
      - shifu-inngest-data:/var/lib/inngest

  sonarqube-db:
    image: postgres:17-alpine
    container_name: shifu-sonarqube-db
    pull_policy: missing
    restart: unless-stopped
    environment:
      POSTGRES_DB: sonarqube
      POSTGRES_USER: ${SONAR_DB_USER:-sonarqube}
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD:-sonarqube-local}
    volumes:
      - shifu-sonarqube-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  sonarqube:
    image: sonarqube:community
    container_name: shifu-sonarqube
    pull_policy: missing
    restart: unless-stopped
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-db:5432/sonarqube
      SONAR_JDBC_USERNAME: ${SONAR_DB_USER:-sonarqube}
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD:-sonarqube-local}
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    ports:
      - "${SONAR_PORT:-19000}:9000"
    volumes:
      - shifu-sonarqube-data:/opt/sonarqube/data
      - shifu-sonarqube-extensions:/opt/sonarqube/extensions
      - shifu-sonarqube-logs:/opt/sonarqube/logs
    depends_on:
      sonarqube-db:
        condition: service_healthy
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
      nproc: 4096

  mailpit:
    image: axllent/mailpit:v1.21
    container_name: shifu-mailpit
    pull_policy: missing
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1026}:1025"
      - "${MAILPIT_UI_PORT:-54326}:8025"

volumes:
  shifu-postgres-data:
  shifu-inngest-data:
  shifu-sonarqube-db-data:
  shifu-sonarqube-data:
  shifu-sonarqube-extensions:
  shifu-sonarqube-logs:
