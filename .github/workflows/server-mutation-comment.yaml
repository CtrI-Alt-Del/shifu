name: Server mutation summary comment

on:
  workflow_run:
    workflows:
      - Server application CI
    types:
      - completed

permissions:
  actions: read
  pull-requests: write

jobs:
  publish:
    name: Publish mutation summary comment
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Download mutation summary
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: server-mutation-summary
          path: ${{ runner.temp }}/mutation-summary
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Create or update pull request comment
        if: steps.download.outcome == 'success'
        uses: actions/github-script@v9
        env:
          SUMMARY_PATH: ${{ runner.temp }}/mutation-summary/mutation-summary.md
        with:
          script: |
            const fs = require('fs')
            const run = context.payload.workflow_run
            const { owner, repo } = context.repo
            const associatedPullRequests = await github.paginate(
              github.rest.repos.listPullRequestsAssociatedWithCommit,
              { owner, repo, commit_sha: run.head_sha },
            )
            const pullRequest = associatedPullRequests.find(
              (candidate) =>
                candidate.head.sha === run.head_sha &&
                candidate.head.repo?.full_name === `${owner}/${repo}`,
            )
            if (!pullRequest) {
              core.info('No same-repository pull request is associated with this run.')
              return
            }

            const issue_number = pullRequest.number
            const marker = '<!-- shifu-mutation-summary -->'
            const body = fs.readFileSync(process.env.SUMMARY_PATH, 'utf8')
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            })
            const previous = comments.find(
              (comment) =>
                comment.user?.login === 'github-actions[bot]' &&
                comment.body?.includes(marker),
            )
            if (previous) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: previous.id,
                body,
              })
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              })
            }
