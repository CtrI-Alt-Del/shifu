name: Server application CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'apps/server/**'
      - '.github/workflows/server-app-ci.yaml'
      - '.python-version'
      - 'pyproject.toml'

permissions:
  contents: read

concurrency:
  group: server-app-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify server application
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: shifu
          POSTGRES_PASSWORD: shifu-local
          POSTGRES_USER: shifu
        ports:
          - 54344:5432
        options: >-
          --health-cmd "pg_isready -U shifu -d shifu"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: apps/server
    env:
      DATABASE_URL: postgresql+psycopg://shifu:shifu-local@127.0.0.1:54344/shifu
      REDIS_URL: redis://localhost:6379/0
      SHIFU_AUTH_AUDIENCE: shifu-api
      SHIFU_AUTH_ISSUER: http://127.0.0.1:7000
      SHIFU_COMMUNICATION_ENCRYPTION_KEYS: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      SHIFU_CONFIRMATION_ACTION_ORIGIN: http://127.0.0.1:7000
      SHIFU_EMAIL_FROM: no-reply@shifu.local
      SHIFU_EMAIL_PROVIDER: smtp
      SHIFU_SERVER_APP_MODE: local
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.13.5

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: 0.11.26
          enable-cache: true
          cache-dependency-glob: apps/server/uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - name: Check Alembic migration drift
        run: uv run alembic check

      - name: Prepare integration database
        run: uv run poe db:upgrade

      - name: Check types
        run: uv run poe check:types

      - name: Check lint
        run: uv run poe check:lint

      - name: Check architecture
        run: uv run poe check:architecture

      - name: Run unit tests
        run: uv run poe test:unit

      - name: Run integration tests
        run: uv run poe test:integration

      - name: Run real Inngest job tests
        run: uv run poe test:jobs

      - name: Build distributions
        run: uv build

      - name: Verify distributions
        run: |
          test -f dist/*.tar.gz
          test -f dist/*.whl
