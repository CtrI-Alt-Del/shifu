            tests/intelligence/server/controllers/test_retry_mentor_response_controller.py \
            tests/intelligence/server/controllers/test_stream_mentor_response_controller.py \
            tests/intelligence/server/agentos/test_mentor_attachment_workflow_boundaries.py \
            tests/intelligence/providers/test_local_mentor_attachment_extractor_provider.py \
            tests/intelligence/ai/test_eval_factories.py \
            tests/intelligence/ai/test_intelligence_workflows_registry.py \
            tests/intelligence/core/domain/test_mentor_attachment_domain.py \
            tests/shared/database/sqlalchemy/repositories/test_events_repository.py \
            tests/shared/messaging/agentos/test_agentos_runtime.py \
            tests/learning/core/use_cases/test_submit_choice_activity_use_case.py \
            tests/learning/server/controllers/test_submit_choice_activity_controller.py \
            tests/intelligence/core/use_cases/test_record_mentor_response_progress_use_case.py \
            tests/intelligence/core/use_cases/test_remove_mentor_attachment_use_case.py \
            tests/intelligence/rest/test_attachment_request_boundaries.py \
            tests/intelligence/server/controllers/test_mentor_attachment_storage_http_boundary.py \
            tests/intelligence/server/controllers/test_mentor_attachments_controller.py \
            tests/messaging/inngest/jobs/intelligence/test_purge_mentor_attachments_on_account_deleted_job.py \
            tests/messaging/inngest/jobs/intelligence/test_purge_mentor_summaries_on_account_deleted_job.py \
            tests/rest/handlers/test_app_error_handler.py \
            tests/shared/messaging/agentos/test_agentos_client.py \
            tests/shared/messaging/agentos/test_agentos_handoff_store.py \
            tests/intelligence/server/agentos/test_agent_monitoring_workflow.py \
            tests/shared/messaging/test_outbox_brokers.py \
            tests/shared/test_settings.py \
            tests/shared/providers/test_s3_file_storage_provider.py

          uv run coverage combine

      - name: Generate per-file coverage report
        run: uv run coverage json -o coverage.json

      - name: Enforce thresholds for every changed production file
        shell: bash
        run: >-
          uv run python scripts/check_changed_coverage.py
          --base origin/main --report coverage.json --data-file .coverage
          | tee changed-coverage-summary.txt

      - name: Upload changed-file coverage report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: server-changed-file-coverage
          path: |
            apps/server/coverage.json
            apps/server/.coverage
            apps/server/changed-coverage-summary.txt
          if-no-files-found: warn

  evals:
    name: Server real AI evals
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/server
    env:
      SHIFU_RUN_REAL_AI_EVALS: "1"
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_PROMPT_LOGGING_DISABLED: "true"
      MENTOR_TITLE_PROMPT_LOGGING_DISABLED: "true"
      REDIS_URL: redis://localhost:6379/0
      SHIFU_AUTH_AUDIENCE: shifu-api
      SHIFU_AUTH_ISSUER: http://127.0.0.1:7000
      SHIFU_COMMUNICATION_ENCRYPTION_KEYS: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      SHIFU_CONFIRMATION_ACTION_ORIGIN: http://127.0.0.1:7000
      SHIFU_EMAIL_FROM: no-reply@shifu.local
      SHIFU_EMAIL_PROVIDER: smtp
      SHIFU_SERVER_APP_MODE: local
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.13.5

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: 0.11.26
          enable-cache: true
          cache-dependency-glob: apps/server/uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - name: Prepare pinned local Mentor model
        run: >-
          uv run python -c
          'from shifu.intelligence.providers.embeddings.sentence_transformers.sentence_transformers_embeddings_provider import SentenceTransformersEmbeddingsProvider;
          SentenceTransformersEmbeddingsProvider(local_files_only=False)'

      - name: Run all real evals
        run: uv run python evals/run.py --output-dir test-results/evals

      - name: Upload eval reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: server-evals
          path: apps/server/test-results/evals
          if-no-files-found: error
