            tests/learning/core/use_cases/test_evaluate_choice_activity_use_case.py \
            tests/learning/messaging/test_learning_inngest_messaging.py \
            tests/learning/server/agentos/test_learning_code_evaluation_workflow.py \
            tests/learning/server/controllers/test_adaptive_journey_controller.py::TestAdaptiveLabSeed::test_should_exercise_two_competencies_and_persist_progress \
            tests/learning/server/controllers/test_activity_payload_limit_middleware.py \
            tests/learning/server/controllers/test_learning_pipe_dependencies.py \
            tests/intelligence/core/use_cases/test_upload_mentor_attachment_use_case.py \
            tests/intelligence/core/use_cases/test_prepare_mentor_attachment_use_case.py \
