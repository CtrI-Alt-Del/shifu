name: Web application CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'apps/web/**'
      - '.github/workflows/web-app-ci.yaml'
      - '.node-version'
      - '.npmrc'
      - 'biome.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'

permissions:
  contents: read

concurrency:
  group: web-app-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  types:
    name: Web type checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check types
        run: pnpm --filter web check:types

  lint:
    name: Web lint checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check lint
        run: pnpm --filter web check:lint

  architecture:
    name: Web architecture checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check architecture
        run: pnpm --filter web check:architecture

  unit-tests:
    name: Web unit tests
    runs-on: ubuntu-latest
    env:
      BETTER_AUTH_DATABASE_URL: postgresql://shifu:shifu-local@127.0.0.1:54344/shifu
      BETTER_AUTH_SECRET: ci-secret-with-at-least-32-characters-for-tests
      DATABASE_URL: postgresql+psycopg://shifu:shifu-local@127.0.0.1:54344/shifu
      REDIS_URL: redis://127.0.0.1:6379/0
      SHIFU_AUTH_AUDIENCE: shifu-api
      SHIFU_AUTH_ISSUER: http://127.0.0.1:7000
      SHIFU_COMMUNICATION_ENCRYPTION_KEYS: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      SHIFU_IDENTITY_API_URL: http://127.0.0.1:7777
      SHIFU_SERVER_APP_MODE: local
      SHIFU_SERVER_APP_PORT: '7777'
      SHIFU_WEB_APP_PORT: '7000'
      SHIFU_WEB_APP_URL: http://127.0.0.1:7000
      VITE_SHIFU_SERVER_URL: http://127.0.0.1:7777
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm --filter web test:unit

  browser-integration:
    name: Web browser integration
    runs-on: ubuntu-latest
    env:
      BETTER_AUTH_DATABASE_URL: postgresql://shifu:shifu-local@127.0.0.1:54344/shifu
      BETTER_AUTH_SECRET: ci-secret-with-at-least-32-characters-for-tests
      DATABASE_URL: postgresql+psycopg://shifu:shifu-local@127.0.0.1:54344/shifu
      REDIS_URL: redis://127.0.0.1:6379/0
      SHIFU_AUTH_AUDIENCE: shifu-api
      SHIFU_AUTH_ISSUER: http://127.0.0.1:7000
      SHIFU_COMMUNICATION_ENCRYPTION_KEYS: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      SHIFU_IDENTITY_API_URL: http://127.0.0.1:7777
      SHIFU_SERVER_APP_MODE: local
      SHIFU_SERVER_APP_PORT: '7777'
      SHIFU_WEB_APP_PORT: '7000'
      SHIFU_WEB_APP_URL: http://127.0.0.1:7000
      VITE_SHIFU_SERVER_URL: http://127.0.0.1:7777
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: shifu
          POSTGRES_PASSWORD: shifu-local
          POSTGRES_USER: shifu
        ports:
          - 54344:5432
        options: >-
          --health-cmd "pg_isready -U shifu -d shifu"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.13.5

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: 0.11.26
          enable-cache: true
          cache-dependency-glob: apps/server/uv.lock

      - name: Install server dependencies
        working-directory: apps/server
        run: uv sync --frozen

      - name: Prepare server database
        working-directory: apps/server
        run: uv run poe db:upgrade

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Run integration tests
        run: pnpm --filter web test:integration

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: apps/web/playwright-report
          if-no-files-found: ignore

  build:
    name: Build web application
    runs-on: ubuntu-latest
    env:
      BETTER_AUTH_DATABASE_URL: postgresql://shifu:shifu-local@127.0.0.1:54344/shifu
      BETTER_AUTH_SECRET: ci-secret-with-at-least-32-characters-for-tests
      DATABASE_URL: postgresql+psycopg://shifu:shifu-local@127.0.0.1:54344/shifu
      REDIS_URL: redis://127.0.0.1:6379/0
      SHIFU_AUTH_AUDIENCE: shifu-api
      SHIFU_AUTH_ISSUER: http://127.0.0.1:7000
      SHIFU_COMMUNICATION_ENCRYPTION_KEYS: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      SHIFU_IDENTITY_API_URL: http://127.0.0.1:7777
      SHIFU_SERVER_APP_MODE: local
      SHIFU_SERVER_APP_PORT: '7777'
      SHIFU_WEB_APP_PORT: '7000'
      SHIFU_WEB_APP_URL: http://127.0.0.1:7000
      VITE_SHIFU_SERVER_URL: http://127.0.0.1:7777
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm --filter web build

  verify:
    name: Verify web application
    if: always()
    needs:
      - types
      - lint
      - architecture
      - unit-tests
      - browser-integration
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Require all Web CI jobs to pass
        env:
          TYPES_RESULT: ${{ needs.types.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          ARCHITECTURE_RESULT: ${{ needs.architecture.result }}
          UNIT_TESTS_RESULT: ${{ needs.unit-tests.result }}
          BROWSER_INTEGRATION_RESULT: ${{ needs.browser-integration.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          if [[ "$TYPES_RESULT" != "success" || \
            "$LINT_RESULT" != "success" || \
            "$ARCHITECTURE_RESULT" != "success" || \
            "$UNIT_TESTS_RESULT" != "success" || \
            "$BROWSER_INTEGRATION_RESULT" != "success" || \
            "$BUILD_RESULT" != "success" ]]; then
            echo "One or more Web CI jobs did not pass."
            exit 1
          fi
