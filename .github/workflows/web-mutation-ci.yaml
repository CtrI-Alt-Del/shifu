name: Web mutation suite

on:
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-mutation-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutate:
    name: Run full web mutation suite
    runs-on: ubuntu-latest
    env:
      BETTER_AUTH_DATABASE_URL: postgresql://shifu:shifu-local@127.0.0.1:54344/shifu
      BETTER_AUTH_SECRET: ci-secret-with-at-least-32-characters-for-tests
      DATABASE_URL: postgresql+psycopg://shifu:shifu-local@127.0.0.1:54344/shifu
      REDIS_URL: redis://127.0.0.1:6379/0
      SHIFU_AUTH_AUDIENCE: shifu-api
      SHIFU_AUTH_ISSUER: http://127.0.0.1:7000
      SHIFU_COMMUNICATION_ENCRYPTION_KEYS: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      SHIFU_IDENTITY_API_URL: http://127.0.0.1:7777
      SHIFU_SERVER_APP_MODE: local
      SHIFU_SERVER_APP_PORT: '7777'
      SHIFU_WEB_APP_PORT: '7000'
      SHIFU_WEB_APP_URL: http://127.0.0.1:7000
      VITE_SHIFU_SERVER_URL: http://127.0.0.1:7777
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run full mutation suite
        run: pnpm --filter web test:mutation --all

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: web-mutation-report
          path: apps/web/reports/mutation
          if-no-files-found: ignore
